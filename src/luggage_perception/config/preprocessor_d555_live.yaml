# Live D555 backend. JPEG colour and lossless 16UC1 PNG depth are decoded
# exactly once at the shared preprocessor boundary. The upstream adapter maps
# the device acquisition clock; receipt time is retained only as diagnostics.
sensor_preprocessor:
  ros__parameters:
    input.color_image: /camera/d555/color/image_raw/compressed
    input.depth_image: /camera/d555/aligned_depth_to_color/image_raw/compressed
    input.camera_info: /camera/d555/aligned_depth_to_color/camera_info
    input.color_camera_info: /camera/d555/color/camera_info
    input.joint_states: /joint_states
    input.use_compressed: true
    camera_input_qos_reliability: best_effort
    output_cloud_frame: d555_color_optical_frame
    use_sim_time: false
    camera_pair_tolerance_sec: 0.005
    camera_wait_deadline_sec: 0.150
    camera_info_max_age_sec: 1.0
    camera_maxlen: 15
    camera_horizon_sec: 1.0
    joint_horizon_sec: 1.0
    stale_sec: 0.20
    enable_lidar_output: false
    enable_imu: false
    motion_gate.enabled: true
    motion_gate.velocity_threshold: 0.02
    motion_gate.settle_time_sec: 0.5
    motion_gate.joint_state_timeout_sec: 1.0
