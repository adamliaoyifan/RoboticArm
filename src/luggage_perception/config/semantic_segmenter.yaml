# Semantic perception configuration.
#
# Consumed by semantic_segmenter_node (RGB -> label mask) and
# semantic_point_filter_node (mask + depth -> cargo/obstacle clouds).
# One file, one ros__parameters section per node; launch passes the same
# file to both and each node picks its own section.
#
# Label convention (see luggage_perception/semantic_segmenter.py):
#   0 = background
#   1 = container_wall
#   2 = cargo            # primary task objects
#   3 = robot_arm
#   4 = unknown_object   # kept as conservative obstacle
#
# class_mapping_labels is parallel to prompts: prompts[i] maps to
# class_mapping_labels[i]. Unmapped prompts would default to 4
# (unknown_object) so detections are kept, not silently dropped.

semantic_segmenter:
  ros__parameters:
    # Backend: "stub" (no ML deps), "bbox_fill", "yolo_world",
    # "yolo_world_sam2". Missing deps fall back to "stub(fallback:...)".
    # yolo_world is this workspace's working default (ultralytics + torch-cu
    # present); eval runs add require_backend so a stub fallback cannot
    # fake a report.
    backend: yolo_world
    model_name: yolov8s-world.pt
    # cuda: measured 3.5 ms/frame (286 FPS) on the RTX 5090 vs 29 ms/frame
    # CPU for yolov8s-world at 640x480. Set "cpu" on hosts without a GPU.
    device: cuda
    # --- Hardware-tunable confidence floors (live, no restart) ---
    # Node: /semantic_segmenter. All three are ROS 2 parameters.
    #   ros2 param get /semantic_segmenter confidence_threshold
    #   ros2 param set /semantic_segmenter confidence_threshold 0.2
    #   ros2 param set /semantic_segmenter cargo_min_confidence 0.2
    #   ros2 param set /semantic_segmenter robot_arm_confidence_threshold 0.5
    # Launch overlay: load semantic_segmenter.real.yaml after this file, or
    # pass ``-p confidence_threshold:=0.15`` on the segmenter node.
    # Current values are also in ~/stats_json every stats tick.
    #
    # confidence_threshold: YOLO-World predict(conf=). Below this, no box
    #   is emitted. Scores like 0.02 are ignored.
    # cargo_min_confidence: among workspace-accepted cargo boxes, keep the
    #   highest-confidence compact AABB at or above this floor. May be
    #   raised above the YOLO floor without changing predict().
    # robot_arm_confidence_threshold: class-3 paint floor. Geometric
    #   self-body (panel mesh + row-band) is unchanged.
    confidence_threshold: 0.2
    cargo_min_confidence: 0.2
    robot_arm_confidence_threshold: 0.5
    sam2.checkpoint: facebook/sam2-hiera-small
    sam2.model_type: sam2_hiera_s

    # Open-vocabulary text prompts fed to YOLO-World.
    # The scene-descriptive prompt is what actually fires on a top-down box;
    # the bare class names stay for conventional viewpoints (real hardware).
    prompts:
      - luggage on a platform viewed from directly above
      # PF-R5 rework (2026-09-04): the vintage-mesh suitcase drops below
      # the 0.04 threshold at diagonal-yaw poses in one lighting state
      # (0.01-0.03 measured); this descriptive prompt lifts those frames
      # to 0.17-0.23 offline across the full 16-pose sweep with no
      # threshold change.
      - vintage leather suitcase with handles viewed from directly above
      - suitcase
      - luggage
      - box
      - container
      - floor
      - robot arm
    class_mapping_labels: [2, 2, 2, 2, 2, 1, 0, 3]

    # Wrist D435 is bolted to the suction panel. Project the panel collision
    # meshes into the camera to get the real curved silhouette (not a full
    # bottom strip). Row-band is only the fallback if meshes/TF are missing.
    self_body_from_mesh: true
    self_body_dilate_px: 6
    self_body_mesh_package: luggage_gazebo
    self_body_mesh_dir: models/suction_panel/collision
    self_body_meshes: [p01.stl, p02.stl, p03.stl, p04.stl, p05.stl]
    self_body_mesh_origin: [-0.0909, -0.28583, -0.0909]
    self_body_camera_frame: camera_depth_optical_frame
    self_body_panel_frame: suction_panel
    # URDF mount chain used when TF is not ready yet (same numbers as
    # eef_mount_adapter_origin.xacro + camera_mount_origin.xacro).
    self_body_adapter_xyz: [0.0168, -0.0156, 0.0702]
    self_body_adapter_rpy: [1.57707939, -0.00003948, -3.13530959]
    self_body_camera_xyz: [0.013, 0.097, -0.021]
    self_body_camera_rpy: [0.03769911, 1.36345121, 1.57079633]
    self_body_row_start_frac: 0.85

    # Eval runs must set this (e.g. "yolo_world"): startup fails unless the
    # actual backend matches, so a stub fallback can never fake a report.
    require_backend: ""
    # 0 = unlimited. YOLO on CPU is slower than the 4-6 Hz preprocessed
    # input; unlimited processing would pile callbacks up.
    max_rate_hz: 0.0
    # PF-R9 g2: the overlay is a debug viz product; per-frame cv2 drawing
    # cost is not paid by the online sim-eval graph. hardware_pick.launch.py
    # overrides this to true so site bags have /luggage/semantic/overlay.
    publish_overlay: false

    # YOLO is per-frame; a miss used to publish an empty mask and drop cargo.
    # Keep 5 frames and hold the consensus cargo bbox when >=50% of the
    # window saw cargo. RGB jump / bbox IoU collapse resets the window so
    # a new spawn cannot inherit the previous suitcase.
    temporal_window_frames: 5
    temporal_min_positive_ratio: 0.5
    temporal_scene_change_mad: 10.0
    temporal_bbox_iou_reset: 0.3

    # Sim/eval FP gate (PF-R8 A1): backproject bbox centre onto the
    # pickup-platform plane and keep boxes that land in the scene_tf
    # square. hardware_pick.launch.py sets this false: site crop is the
    # YOLO RGB bbox projected through aligned depth, not that square.
    # Missing camera_info or stamped TF still accepts a compact suitcase
    # with reason predicate_unavailable (flagged, never faked) but rejects
    # an edge-strip bbox (predicate_unavailable_edge_strip).
    workspace_accept_enabled: true
    workspace_center_xy: [-1.0, 0.0]
    workspace_half_extents: [0.5, 0.5]
    workspace_plane_z: 0.86
    workspace_margin_m: 0.15
    workspace_world_frame: world

    input.color_image: /luggage/preprocessed/camera/color/image
    output.mask: /luggage/semantic/mask
    output.overlay: /luggage/semantic/overlay
    output.instance_mask: /luggage/semantic/instance_mask
    output.yolo_detections: /luggage/semantic/yolo_detections
    output.stats: ~/stats_json

semantic_point_filter:
  ros__parameters:
    # PF-R9 g2: aligned depth image replaces the preprocessed cloud.
    input.depth_image: /luggage/preprocessed/camera/depth/image
    input.mask: /luggage/semantic/mask
    input.instance_mask: /luggage/semantic/instance_mask
    input.camera_info: /luggage/preprocessed/camera/color/camera_info
    output.cargo_points: /luggage/semantic/cargo_points
    output.obstacle_points: /luggage/semantic/obstacle_points
    output.stats: ~/stats_json
    output.cargo_voxel_size: 0.005
    # Label routing: cargo feeds the detector; obstacles are conservative.
    cargo_labels: [2]
    obstacle_labels: [2, 4]
    # "identity": gz sim color/depth share one sensor (rotation=I, t=0).
    # "config": real D435 depth_to_color from realsense_extrinsics_config.
    extrinsics_source: identity
    realsense_extrinsics_config: ""
    # Exact-stamp join buffers (aligned depth / masks), 15 entries /
    # 1.0 second on the primary camera clock (PF-R9 g2 fixed contract).
    buffer_maxlen: 15
    # PF-R9 g2: deterministic [::2] decimation of the deprojected cargo /
    # obstacle pixels (a new product — outside the payload identity
    # contract). Retained density ~15k pre-voxel vs min_points 50 /
    # min_top_points 80; geometry non-regression carries in D6/PF-R10.
    output_pixel_stride: 2
    # PF-R10 g3: expand a too-small accepted YOLO AABB across the closest
    # same-depth lid band. 30 mm stays on the suitcase top (platform is one
    # luggage-height farther; a mixed front face is farther than the lid).
    # 0 disables. A component larger than max_pixels is rejected so a
    # platform-level seed cannot flood the floor. Detector RANSAC /
    # min_points / min_confidence are unchanged.
    cargo_grow_depth_tol_mm: 30
    cargo_grow_max_pixels: 60000
    cargo_grow_max_radius_px: 400
    # Search this many pixels around a platform-level seed for a closer
    # lid. 0 keeps the seed AABB only. A mask that is not at least
    # cargo_grow_raise_mm closer than its surrounding ring is cleared so
    # a platform patch cannot be reported as a valid top.
    cargo_grow_search_radius_px: 400
    cargo_grow_raise_mm: 50
    # PF-R9 B5: stats serialization on a timer instead of every cloud/mask
    # callback (~60-70 Hz json.dumps inside the join's callback group).
    stats_publish_hz: 1.0
    # NOTE: no sync_slop and no fallback_to_raw. Pairing is an exact
    # (sec, nanosec) join on the preprocessor's primary stamp; slop-based
    # pairing lives only in the preprocessor. An unfiltered cloud is never
    # published as cargo geometry (acceptance criterion) - no mask means
    # no cargo cloud, reason recorded in stats.
