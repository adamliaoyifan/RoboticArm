# POS-1 place-only perfect-geometry eval profile (docs/plans/
# place_only_perfect_geometry_sim.md).
#
# Eval-only: production defaults in sim_world.launch.py are unchanged. This
# profile starts the place/map chain without any perception node (asserted
# by the driver's graph check), with a deterministic pickup fixture (no
# jitter, no yaw spread, fixed seed, fixed catalog sequence in P0-P4 case
# order: carryon, standard, large, carryon, standard).
sim_world:
  gui: false
  use_rviz: false
  use_perception: false
  use_semantic: false
  use_moveit: true
  use_motion: true
  use_vacuum: true
  use_cargo_map: true
  use_packing: true
  # Plan acceptance B: selected box keeps >=10 mm inward clearance from the
  # seven-face hull (production default stays 0 = flush-wall).
  hull_margin: 0.01
  # Retain enough feasible candidates for the driver's pre-execution
  # rejection/retry loop (default 24 is visualization-sized).
  last_result_max_candidates: 200
  # P0-P2 finding (2026-09-14 dry-run): after greedy P0(carryon)+P1(standard)
  # floor placements, the large box has no reachable slot — the aperture
  # y-shadow leaves a 0.433 m free band (needs 0.50) and everything deeper
  # than container x~0.0 is atlas/IK unreachable. The only physically
  # placeable option is stacking on the mixed-height P0+P1 tops, whose
  # window support is 0.5625; the production default 0.6 rejects it. The
  # eval accepts mixed-height stacked support at 0.55 — the physical
  # outcome is still gated by the roll/pitch <2 deg, drift <20 mm, and
  # inside-hull acceptance checks. Flagged for reviews in the POS-1 thread.
  min_support_ratio: 0.55
  visual_kind: mesh
  size_mode: catalog
  yaw_mode: discrete
  yaw_range: "0.0,0.0"
  xy_jitter_range: "0.0,0.0"
  sequence_ids: [carryon, standard, large, carryon, standard]
  random_seed: 20260914
  spawn_at_observe: true
  observe_pose_name: pickup_observe
  # Carried-payload execution stability: the standard box's traverse froze
  # the controller at 0.3 scaling (goal_time violations with joints locked
  # mid-path); halve the commanded trajectory rates for the place-only
  # stack. Production default stays 0.3.
  velocity_scaling: 0.15
  acceleration_scaling: 0.15
