# Observe -> prepare all six legs -> execute the retained plan and barriers.
# Explicit client --start is required; launch alone does not run a cycle.
runtime:
  planning_pipeline: joint_operation
  gui: false
  # Known-plane replay at actual pickup pose: OGRE2 places17/40 floor rays
  # above .53m (max +7.9mm); OGRE places0/41 (max +0.42mm). Simulation-only.
  server_render_engine: ogre
  use_rviz: false
  use_moveit: true
  frame_runtime: false
  # Exact saved full-model misses need 4-5s on some constrained connections.
  # Search alternatives within the existing 300s diagnostic watchdog.
  operation_connection_max_edge_s: 5.0
  operation_max_branch_attempts: 8
  operation_max_branch_attempts_per_candidate: 2
  # Diagnostic27 carry alone was253.6s; the former300s whole-action literal
  # expired in flight. Functional qualification first; no production SLA yet.
  operation_execution_budget_s: 600.0
  # Diagnostic32: the new carried-end view finishes occupancy convergence7s
  # after three checks are exhausted, then remains unchanged for18s. Reuse
  # the existing bounded retry range; every attempt still fully revalidates.
  operation_source_refresh_attempts: 8
  operation_post_place_views: 3
  # Same saved view: stride4 hits270 target cells, stride2 432, stride1 438.
  # Use more actual pixels without interpolation or changing O resolution.
  operation_depth_pixel_stride: 2
  cargo_map_resolution_m: 0.02
features:
  use_perception: true
  use_semantic: true
  use_motion: true
  use_vacuum: true
  use_cargo_map: false
  use_packing: false
  start_placement_prior: false
perception:
  top_surface_mode: dynamic
  semantic_require_backend: bbox_fill
scene:
  observe_pose_name: pickup_observe_sim
  spawn_at_observe: true
spawner:
  visual_kind: mesh
  size_mode: catalog
  sequence_ids: [carryon]
  yaw_range: [0.0, 0.0]
  xy_jitter_range: [0.0, 0.0]
