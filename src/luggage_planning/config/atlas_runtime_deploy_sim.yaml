# Gazebo-flavour deploy-scene atlas runtime (ST09-I S5).
#
# The strict hash policy binds the atlas to the URDF the LIVE stack
# publishes: a Gazebo sim_world stack publishes the gz-flavour
# robot_description (ros2_control GazeboSimSystem plugin blocks), whose
# MD5 (689838e5ab5948877ea9c87f388a0474) differs from the
# hardware/mock flavour (22ed00b5...) frozen in
# atlas_runtime_deploy.yaml. The sampled reachable set is IDENTICAL
# (all four NPZ are byte-equal to data/reachability_atlas_deploy/ —
# the flavour difference touches only the ros2_control blocks, not
# kinematics); this cell exists so strict identity holds in Gazebo
# without relaxing the policy.
#
# Pass EXPLICITLY via atlas_runtime_config:= (the implicit matcher
# would otherwise select atlas_runtime_deploy.yaml by scene hash and
# strict-refuse). Long term (not S5): split identity into a
# geometry-semantic hash and a runtime-backend hash.
# Schema below is field-for-field atlas_runtime_deploy.yaml; only
# atlas_dir differs.
enabled: true
atlas_dir: reachability_atlas_deploy_sim
basename: "s20_container_collision_aware"
atlas_file: ""           # absolute .npz override; meta = same stem + .yaml
hash_policy: "strict"    # off | warn | strict, against the atlas meta hashes
query_offset: [0.0, 0.0, 0.0]   # container-frame [x, y, z] added to queries
payload:
  policy: "auto"         # auto = smallest built atlas enveloping the measured
  explicit_size: [0.0, 0.0, 0.0]
placement:
  hard_reject: true      # high-confidence unreachable cell -> infeasible
  w_reachability: 0.3    # score weight on the atlas prior; 0 = dump-only rank
  dump_only: false       # true = never reject, never re-rank; record only
motion:
  enabled: true
  seed_set: "transit"    # transit | contact | both
  max_seeds: 3           # branches per query (NaN/zero-padded rows dropped)
  mode: "miss-retry"     # miss-retry = after unseeded KDL miss; always-first
  target_z_lift_m: 0.008 # attach-hang compensation for in-container goals
  refine: true           # deterministic offline refine of atlas seeds onto
  fk_verify_tol_m: 0.25
  submit_mode: "joint_goal"
