# Diagnostic bounded model, NOT a calibrated probability of coverage.
# Reload by restarting the selector; each frozen attachment binds these values.
# Pivot: suction_contact_frame origin; axis: its local Z/contact normal.
# Roll/pitch exact; box Z parallel/antiparallel to contact normal required.
yaw_half_range_deg: 5.0
# Box-axis outward margin on EACH face (full dimension grows by twice this).
size_margin_per_face_m: [0.050, 0.050, 0.050]
# Tool-axis +/- translation uncertainty, applied AFTER yaw rotation.
position_half_range_tool_m: [0.100, 0.100, 0.005]
