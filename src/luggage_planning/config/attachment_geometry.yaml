# Attachment-owned diagnostic bounds; no statistical coverage claim.
# W/D growth is symmetric. Parallel axes: height grows away from suction.
# Nonparallel box/contact axes: height and away-position bounds extend both ways.
# Yaw rotates about the measured suction normal; no extra roll/pitch uncertainty.
yaw_half_range_deg: 5.0
size_growth_fraction_wdh: [0.10, 0.10, 0.10]
position_half_range_tool_xy_m: [0.0, 0.0]
away_from_contact_position_error_m: 0.005
