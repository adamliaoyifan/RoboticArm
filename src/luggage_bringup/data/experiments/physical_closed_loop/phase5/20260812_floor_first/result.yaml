summary: >-
  The placement policy change did what it was meant to do: with the near-ROI
  rectangle removed, the planner offers only floor candidates until the floor
  stops fitting boxes, and it never stacked while a reachable floor candidate
  remained. The Gazebo acceptance still fails, but on three execution-layer
  blockers that the widened workspace exposed, none of which is the ranking
  policy.

