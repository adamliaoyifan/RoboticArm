# 实机代码 (site / real-cell). Not part of the Gazebo simulation stack.
# executor.yaml
# Parameters for the trajectory_executor node.
# Load via --ros-args --params-file or via the launch files.

trajectory_executor:
  ros__parameters:

    # ---------------------------------------------------------------
    # Backend selection
    # 'sim'  - pure software simulation, no hardware required
    # 'real' - real robot via HuayanRobot CPSClient SDK
    # ---------------------------------------------------------------
    mode: sim

    # ---------------------------------------------------------------
    # Real-robot connection (ignored in sim mode)
    # ---------------------------------------------------------------
    robot_ip: '192.168.0.10'
    robot_port: 10003

    # Must match luggage motion_planner and MoveIt simple controller manager.
    action_name: '/elfin_arm_controller/follow_joint_trajectory'
    use_sim_time: false

    # ---------------------------------------------------------------
    # Velocity / acceleration limits
    #
    # default_velocity_deg : fallback when trajectory time hints are absent
    # max_velocity_deg     : hard upper clamp on computed velocity
    # command_acceleration_deg : conservative scalar MoveJ acceleration
    # controller_limit_fraction : share of reported velocity/acceleration
    #                             limits available to commands (max 0.8)
    #
    # IMPORTANT: HuayanRobot requires acceleration > velocity.
    # The executor reads the controller's actual joint limits and preflights
    # every waypoint before motion. Site evidence proves 60 deg/s^2 was
    # accepted and 108 deg/s^2 was rejected; do not raise this before the
    # hardware acceptance checklist passes.
    # ---------------------------------------------------------------
    default_velocity_deg: 30.0
    max_velocity_deg: 60.0
    command_acceleration_deg: 60.0
    controller_limit_fraction: 0.8

    # Ctrl+C / launch teardown: disable servo + drop TCP. Do not BlackOut
    # (that cuts 48 V). Opt in only for an explicit power-down.
    power_off_on_disconnect: false

    # ---------------------------------------------------------------
    # Joint names — must match the planning node's URDF joint names
    # ---------------------------------------------------------------
    joint_names:
      - elfin_joint1
      - elfin_joint2
      - elfin_joint3
      - elfin_joint4
      - elfin_joint5
      - elfin_joint6
