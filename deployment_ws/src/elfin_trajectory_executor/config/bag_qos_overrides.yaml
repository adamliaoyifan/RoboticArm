# QoS overrides for ros2 bag record (Jazzy).
# Sensor streams on this site are Best Effort. Do not list /tf, /tf_static,
# or /joint_states here — those stay at their discovered profiles.

/livox/lidar: &sensor
  history: keep_last
  depth: 20
  reliability: best_effort
  durability: volatile

/livox/imu: *sensor

/camera/d555/color/image_raw: *sensor
/camera/d555/color/camera_info: *sensor
/camera/d555/color/metadata: *sensor
/camera/d555/depth/image_rect_raw: *sensor
/camera/d555/depth/camera_info: *sensor
/camera/d555/depth/metadata: *sensor
/camera/d555/depth/color/points: *sensor
/camera/d555/aligned_depth_to_color/image_raw: *sensor
/camera/d555/aligned_depth_to_color/camera_info: *sensor
/camera/d555/rgbd: *sensor
/camera/d555/imu: *sensor
/camera/d555/gyro/sample: *sensor
/camera/d555/accel/sample: *sensor
/camera/d555/color1/image_raw: *sensor
/camera/d555/aligned_depth_to_color1/image_raw: *sensor

/realsense/D555_419222302385_Color: *sensor
/realsense/D555_419222302385_Depth: *sensor
/realsense/D555_419222302385_CompressedColor: *sensor
/realsense/D555_419222302385_Infrared: *sensor
/realsense/D555_419222302385_Motion: *sensor
