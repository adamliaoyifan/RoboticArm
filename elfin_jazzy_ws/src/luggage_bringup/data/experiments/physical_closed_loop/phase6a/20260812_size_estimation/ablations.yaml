findings:
- Height is the most accurate axis by two orders of magnitude (p95 0.29 mm) because
  the platform elevation is a known prior and the top plane is measured directly.
  The user's proposal to derive height from depth plus the table height is not just
  workable, it is the strongest part of the estimate.
- 'The estimator is unbiased on a fully visible top face after the trim compensation
  (mean -3.0 mm, p95 9.5 mm). The remaining error under occlusion is not an estimation
  defect: an edge that is not observed cannot be measured, so it has to be covered
  by the commit margin.'
- The 20 mm commit margin covers 100% of cases with no occlusion and 62% at 10% occlusion.
  If Gazebo shows real occlusion at the pickup view, the margin must be raised to
  roughly half the measured major-axis p95 rather than left at 20 mm.
do_not_repeat:
- Do not re-enable catalog snapping to make the size error look smaller. With continuous
  sizes it discards the measurement instead of cleaning it.
- 'Do not judge the estimator on the occluded rows: those quantify how much margin
  occlusion needs, not how well it measures.'
