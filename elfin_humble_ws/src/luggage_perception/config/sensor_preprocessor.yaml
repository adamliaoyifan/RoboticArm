sensor_preprocessor:
  ros__parameters:
    # Backend binding (PF-R9 g2 canonical colour-aligned RGBD set).
    # Gazebo: colour + D435-like 16UC1 depth share the optical frame and
    # are exactly co-stamped (measured 100%, evidence
    # 2026-09-09_pfr9_g2_payload/depth_rgb_alignment.json). The camera
    # point cloud is not subscribed, waited for, transformed, or
    # published. For the D455 backend, remap to
    # /camera/d555/color/image_raw +
    # /camera/d555/aligned_depth_to_color/image_raw and the d555 colour
    # optical frame.
    input.color_image: /camera/color/image_raw
    input.depth_image: /camera/depth/image_raw
    input.camera_info: /camera/depth/camera_info
    input.color_camera_info: ""
    input.joint_states: /joint_states
    output.color_image: /luggage/preprocessed/camera/color/image
    output.color_info: /luggage/preprocessed/camera/color/camera_info
    output.depth_image: /luggage/preprocessed/camera/depth/image
    output.depth_info: /luggage/preprocessed/camera/depth/camera_info
    output.status: /luggage/preprocessed/status
    # Truthful colour optical frame of the canonical acquisition.
    output_cloud_frame: camera_depth_optical_frame
    enable_lidar_output: false
    enable_imu: false
    # PF-R9 g2 split: pairing tolerance (~exact) and wait deadline on the
    # canonical camera clock. D1 measured the aligned streams exactly
    # co-stamped; the deadline only bounds tail waits and is never
    # advanced by /joint_states. After the deadline with no aligned depth
    # the stamp is skipped (depth_wait_timeout, counted) — a partial
    # acquisition is never emitted.
    camera_slop_sec: 0.005
    camera_pair_tolerance_sec: 0.005
    camera_wait_deadline_sec: 0.060
    camera_info_max_age_sec: 1.0
    # PF-R9 g2 fixed camera cache contract: 15 entries / 1.0 second on
    # the camera clock (23.0 MB payload ceiling at 640x480).
    camera_maxlen: 15
    camera_horizon_sec: 1.0
    joint_horizon_sec: 1.0
    stale_sec: 0.15
    # Annotates geometry_ok on /luggage/preprocessed/status only.
    motion_gate.joint_names:
      - elfin_joint1
      - elfin_joint2
      - elfin_joint3
      - elfin_joint4
      - elfin_joint5
      - elfin_joint6
    motion_gate.velocity_threshold: 0.02
    motion_gate.settle_time_sec: 0.5
    motion_gate.joint_state_timeout_sec: 1.0
    motion_gate.enabled: false
