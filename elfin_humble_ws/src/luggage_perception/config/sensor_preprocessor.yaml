sensor_preprocessor:
  ros__parameters:
    input.color_image: /camera/color/image_raw
    input.depth_image: /camera/depth/image_raw
    input.camera_info: /camera/depth/camera_info
    input.color_camera_info: ""
    input.camera_points: /camera/depth/points
    input.joint_states: /joint_states
    input.lidar: /livox/lidar
    input.imu: /livox/imu
    output.color_image: /luggage/preprocessed/camera/color/image
    output.color_info: /luggage/preprocessed/camera/color/camera_info
    output.depth_image: /luggage/preprocessed/camera/depth/image
    output.depth_info: /luggage/preprocessed/camera/depth/camera_info
    output.camera_points: /luggage/preprocessed/camera/depth/points
    output.status: /luggage/preprocessed/status
    # Gazebo rgbd_camera points are in camera_link axes; the header says optical.
    input_cloud_data_frame: camera_link
    output_cloud_frame: camera_depth_optical_frame
    enable_lidar_output: false
    enable_imu: false
    camera_slop_sec: 0.020
    # PF-R9 B2 split (from the B1 measurement, 130 s window, box present,
    # full semantic load; evidence 2026-09-08_pfr9_throughput/
    # b1_period_probe_pre.json):
    # - gz rgbd_camera co-stamps colour/depth/points, so the pairing
    #   tolerance stays ~exact: 0.005 s (matched pairs arrive p50 2.8 ms
    #   apart; tolerance bounds |stamp diff|, which is 0 for true pairs).
    # - wait deadline 0.060 s > the measured matched-header receipt-lag
    #   max 39.3 ms (p95 22.9 ms) with ~50% margin, and far below
    #   camera_horizon_sec 0.35, so no clamping question arises. The
    #   deadline runs on the RGB stream's own clock (newest buffered RGB
    #   header stamp) and can no longer be advanced by 50 Hz
    #   /joint_states.
    # - after the deadline with no cloud the stamp is skipped
    #   (cloud_wait_timeout, counted in diagnostics): B1 measured 15.2%
    #   of RGB stamps have no same-stamp cloud at all; emitting them
    #   RGB-only would pin cloud_ok near 85% < 95% (B4). The flagged
    #   RGB-only path remains available via camera_emit_rgb_only: true.
    camera_pair_tolerance_sec: 0.005
    camera_wait_deadline_sec: 0.060
    camera_emit_rgb_only: false
    # B1 also measured the QoS alternative: BEST_EFFORT lost 31-37% of
    # messages on both topics vs RELIABLE on this RMW, so inputs stay
    # RELIABLE (the B5 BEST_EFFORT item is skipped with that evidence).
    cloud_input_qos_reliability: reliable
    # PF-R9 B5 optional lever (reviews recommendation E), selected with
    # measured cause: publishing the full 3.7 MB 307k-point cloud blocked
    # the preprocessor (publish p95 233 ms / max 486 ms in
    # cloud_stage_ms), which capped emission at ~3 Hz. Stride 2 keeps all
    # rows/columns at half density: ~77k points, 0.9 MB. Retained cargo
    # density measured ~29.5k -> ~7.4k points (min_points 50,
    # min_top_points 80 — large margin); geometry non-regression is
    # enforced by PF-R10 C1 (top/support z limits, false_measured_height
    # == 0). The filter's (u,v) reprojection still indexes the full-res
    # mask. 1 disables.
    cloud_decimation_stride: 2
    camera_info_max_age_sec: 1.0
    camera_maxlen: 10
    camera_horizon_sec: 0.35
    joint_horizon_sec: 1.0
    stale_sec: 0.15
    # Annotates geometry_ok on /luggage/preprocessed/status only.
    # Does not drop RGB/depth/points. DetectLuggage does not wait on this gate;
    # the cargo tracker publishes the latest associated cloud instead.
    motion_gate.joint_names:
      - elfin_joint1
      - elfin_joint2
      - elfin_joint3
      - elfin_joint4
      - elfin_joint5
      - elfin_joint6
    motion_gate.velocity_threshold: 0.02
    motion_gate.settle_time_sec: 0.5
    motion_gate.joint_state_timeout_sec: 1.0
    motion_gate.enabled: false
