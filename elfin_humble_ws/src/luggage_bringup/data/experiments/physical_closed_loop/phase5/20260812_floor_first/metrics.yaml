# Placement-policy metrics (the change under test) and execution metrics
# (pre-existing blockers that the widened workspace exposed).
placement_policy:
  # Every seed offered only floor candidates for the first box, and the smoke
  # run still offered only floor candidates for the second box after the first
  # was committed. This is the behaviour the near-ROI rectangle used to make
  # impossible: it left 0.045 x 0.145 m of floor after box one.
  first_box_candidates_total: 8
  first_box_candidates_on_floor: 8
  second_box_candidates_total: 8       # smoke run, map_revision=2, placed=1
  second_box_candidates_on_floor: 8
  atlas_rejected_candidates: 0
  premature_stack_count: 0
  committed_container_y_first_box: -0.635   # old near_roi_y_min was -0.59

