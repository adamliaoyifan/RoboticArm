# Interactive / development log configuration (log4cxx, C++ nodes only).
#
# rospy nodes do NOT read this file; their level comes from the
# LUGGAGE_LOG_LEVEL environment variable via log_level_utils.resolve_log_level().
#
# Selected by ROSCONSOLE_CONFIG_FILE, set from the `log_level` launch arg.

log4j.rootLogger=INFO, ros_console

log4j.appender.ros_console=org.apache.log4j.ConsoleAppender
log4j.appender.ros_console.layout=org.apache.log4j.PatternLayout
log4j.appender.ros_console.layout.ConversionPattern=[%p] [%c]: %m%n

# Our own packages stay verbose here.
log4j.logger.ros.luggage_bringup=INFO
log4j.logger.ros.luggage_planning=INFO
log4j.logger.ros.luggage_perception=INFO
log4j.logger.ros.luggage_packing=INFO
log4j.logger.ros.luggage_gazebo=INFO
