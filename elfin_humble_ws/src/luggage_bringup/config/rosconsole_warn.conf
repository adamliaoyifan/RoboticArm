# Acceptance-run log configuration (log4cxx, C++ nodes only).
#
# rospy nodes do NOT read this file; their level comes from the
# LUGGAGE_LOG_LEVEL environment variable via log_level_utils.resolve_log_level().
#
# Goal: an acceptance log that a human can read end to end. The bulk of the
# noise in a loading run comes from move_group/OMPL/controller internals, which
# no change to our Python code can silence -- only this file can.
#
# Selected by ROSCONSOLE_CONFIG_FILE, set from the `log_level` launch arg.

log4j.rootLogger=WARN, ros_console

log4j.appender.ros_console=org.apache.log4j.ConsoleAppender
log4j.appender.ros_console.layout=org.apache.log4j.PatternLayout
log4j.appender.ros_console.layout.ConversionPattern=[%p] [%c]: %m%n

# rootLogger alone is not enough: rosconsole loads its built-in config first,
# which pins `log4j.logger.ros=INFO`, and every ROS logger inherits from it.
# Overriding `ros` is what actually silences move_group / OMPL / TRAC-IK /
# controller_manager, whose logger names are not all guessable.
log4j.logger.ros=WARN

# Third-party chatter: planning pipeline progress, per-trajectory execution
# notices and Cartesian path reports are all routine success messages.
log4j.logger.ros.moveit=WARN
log4j.logger.ros.moveit_ros_planning=WARN
log4j.logger.ros.moveit_ros_move_group=WARN
log4j.logger.ros.moveit_ros_planning_interface=WARN
log4j.logger.ros.ompl=WARN
log4j.logger.ros.gazebo_ros_control=WARN
log4j.logger.ros.controller_manager=WARN
log4j.logger.ros.joint_trajectory_controller=WARN
log4j.logger.ros.robot_state_publisher=WARN

# Our own packages: acceptance-critical records are emitted at WARN
# (see orchestrator publish_status level=), so WARN is enough here.
log4j.logger.ros.luggage_bringup=WARN
log4j.logger.ros.luggage_planning=WARN
log4j.logger.ros.luggage_perception=WARN
log4j.logger.ros.luggage_packing=WARN
log4j.logger.ros.luggage_gazebo=WARN
